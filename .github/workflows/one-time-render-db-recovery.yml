name: One-time Render DB recovery

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  resume-db:
    runs-on: ubuntu-latest
    steps:
      - name: Resume Render Postgres if an API key is already configured
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
          RENDER_TOKEN: ${{ secrets.RENDER_TOKEN }}
        run: |
          set -euo pipefail
          TOKEN="${RENDER_API_KEY:-${RENDER_API_TOKEN:-${RENDER_TOKEN:-}}}"
          if [ -z "$TOKEN" ]; then
            echo "No Render API secret is configured in this repository."
            exit 0
          fi

          DB_ID='dpg-danqueqjnfac739i9v70-a'
          API="https://api.render.com/v1/postgres/$DB_ID"
          echo "Requesting Postgres resume..."
          CODE="$(curl -sS -o /tmp/resume.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/json" \
            "$API/resume")"
          echo "Resume request HTTP $CODE"
          cat /tmp/resume.json || true
          case "$CODE" in
            202|200) ;;
            409)
              echo "Database may already be resuming/resumed; continuing to poll."
              ;;
            *)
              echo "Render resume request failed."
              exit 1
              ;;
          esac

          for i in $(seq 1 18); do
            sleep 10
            STATUS="$(curl -sS \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/json" \
              "$API" | python -c 'import json,sys; print(json.load(sys.stdin).get("status",""))')"
            echo "DB status check $i/18: $STATUS"
            if [ "$STATUS" = "available" ] || [ "$STATUS" = "running" ]; then
              exit 0
            fi
          done

          echo "Database did not reach an available state within the polling window."
          exit 1

      - name: Remove this recovery workflow
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout "${GITHUB_REF_NAME}"
          git rm ".github/workflows/one-time-render-db-recovery.yml"
          git commit -m "chore: remove one-time render db recovery workflow"
          git push
