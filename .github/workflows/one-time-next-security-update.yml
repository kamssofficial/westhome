name: One-time dependency security update

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Upgrade Next.js to patched stable release
        run: |
          set -euo pipefail
          npm install next@16.3.5 --save-exact
          npm test
          npx tsc --noEmit

      - name: Commit dependency update
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes were necessary."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "security(next): upgrade to patched 16.3.5"
          git push

      - name: Remove one-time workflow
        if: \${{ success() }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-next-security-update.yml
          git commit -m "chore: remove one-time Next security workflow"
          git push
