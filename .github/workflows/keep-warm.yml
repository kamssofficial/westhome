# Keeps the Render free instance from idling out. Free web services sleep
# after 15 minutes without traffic and then take ~60s to wake, which shoppers
# feel as a dead store. A ping every 10 minutes keeps it warm.
#
# Free on GitHub because this repository is public. Note that GitHub disables
# scheduled workflows on repos with no activity for 60 days - any commit
# (even to a docs file) resets that clock.
#
# The 120s timeout matters: if the instance did sleep, this ping is the one
# that pays the ~60s cold start, and it must not abort before the app answers.

name: Keep warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the storefront catalogue
        run: |
          set -euo pipefail
          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 120 \
            'https://www.westhome.in/api/products?limit=1')"
          echo "GET /api/products -> HTTP $code"
          test "$code" = "200"
