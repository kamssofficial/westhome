# Uptime check for the Freebuff managed deployment.
#
# History: this workflow was "Keep warm" — it pinged the storefront every few
# minutes because the old Render free-tier instance spun down after 15 idle
# minutes and took ~60s to wake. The store now runs on Freebuff managed
# hosting (www.westhome.in), which serves from an always-on edge and never
# sleeps, so warm-keeping is obsolete.
#
# The schedule is kept as an uptime ALARM: if the storefront stops returning
# 200, the run fails and the repo shows a red X as the signal. GitHub defers
# schedule crons under load (fires every 2-3h instead of every 10 min); a
# couple of spaced retries inside the run avoid false alarms from a transient
# blip or a mid-deploy window. For continuous 5-minute monitoring, point a
# free external uptime monitor (e.g. UptimeRobot) at
# https://www.westhome.in/api/health.
#
# Note: GitHub disables scheduled workflows on repos with no activity for 60
# days — any commit (even to a docs file) resets that clock.

name: Uptime check

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: uptime-check
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Verify the storefront answers
        run: |
          set -euo pipefail
          URL='https://www.westhome.in/api/health'
          ok=0
          for i in 1 2 3; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 60 "$URL" || true)"
            echo "attempt $i/3: GET /api/health -> HTTP $code"
            if [ "$code" = "200" ]; then
              ok=1
              break
            fi
            [ "$i" -lt 3 ] && sleep 30
          done
          if [ "$ok" != "1" ]; then
            echo "storefront never returned 200 — the Freebuff deployment looks down"
            exit 1
          fi
