name: One-time npm audit remediation

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Audit, fix, verify, and clean up
        shell: bash
        run: |
          set -u

          npm ci --legacy-peer-deps || exit 1

          npm audit --json > /tmp/audit-before.json 2>/dev/null || true
          BEFORE_HIGH="$(node -e 'const a=require("/tmp/audit-before.json"); console.log(a.metadata?.vulnerabilities?.high ?? 999)')"
          BEFORE_CRITICAL="$(node -e 'const a=require("/tmp/audit-before.json"); console.log(a.metadata?.vulnerabilities?.critical ?? 999)')"
          echo "Before: high=$BEFORE_HIGH critical=$BEFORE_CRITICAL"

          npm audit fix --legacy-peer-deps || true

          if ! npm ci --legacy-peer-deps; then
            echo "Dependency remediation made npm ci fail; reverting dependency changes."
            git checkout -- package.json package-lock.json
            npm ci --legacy-peer-deps || true
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rm .github/workflows/one-time-npm-audit-remediation.yml
            git commit -m "chore: remove one-time npm audit remediation workflow" || true
            git push || true
            exit 0
          fi

          if ! npx prisma generate; then
            echo "Prisma generation failed after remediation; reverting dependency changes."
            git checkout -- package.json package-lock.json
            npm ci --legacy-peer-deps || true
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rm .github/workflows/one-time-npm-audit-remediation.yml
            git commit -m "chore: remove one-time npm audit remediation workflow" || true
            git push || true
            exit 0
          fi

          if ! npm test; then
            echo "Tests failed after remediation; reverting dependency changes."
            git checkout -- package.json package-lock.json
            npm ci --legacy-peer-deps || true
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rm .github/workflows/one-time-npm-audit-remediation.yml
            git commit -m "chore: remove one-time npm audit remediation workflow" || true
            git push || true
            exit 0
          fi

          if ! npx tsc --noEmit; then
            echo "Typecheck failed after remediation; reverting dependency changes."
            git checkout -- package.json package-lock.json
            npm ci --legacy-peer-deps || true
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rm .github/workflows/one-time-npm-audit-remediation.yml
            git commit -m "chore: remove one-time npm audit remediation workflow" || true
            git push || true
            exit 0
          fi

          npm audit --json > /tmp/audit-after.json 2>/dev/null || true
          AFTER_HIGH="$(node -e 'const a=require("/tmp/audit-after.json"); console.log(a.metadata?.vulnerabilities?.high ?? 999)')"
          AFTER_CRITICAL="$(node -e 'const a=require("/tmp/audit-after.json"); console.log(a.metadata?.vulnerabilities?.critical ?? 999)')"
          echo "After: high=$AFTER_HIGH critical=$AFTER_CRITICAL"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$AFTER_CRITICAL" -le "$BEFORE_CRITICAL" ] && [ "$AFTER_HIGH" -lt "$BEFORE_HIGH" ]; then
            git rm .github/workflows/one-time-npm-audit-remediation.yml
            git add package.json package-lock.json
            git commit -m "security(deps): apply safe npm audit remediation" || true
            git push || true
          else
            echo "Audit severity did not improve; reverting dependency changes."
            git checkout -- package.json package-lock.json
            git rm .github/workflows/one-time-npm-audit-remediation.yml
            git commit -m "chore: remove one-time npm audit remediation workflow" || true
            git push || true
          fi
