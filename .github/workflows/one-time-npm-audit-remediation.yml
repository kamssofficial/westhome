name: One-time npm audit remediation

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  audit-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply non-breaking npm audit fixes
        env:
          DATABASE_URL: \${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          npm audit fix --package-lock-only --legacy-peer-deps
          npm ci --legacy-peer-deps
          npx prisma generate
          npm test
          npx tsc --noEmit
          npm audit --audit-level=high || true

      - name: Commit lockfile remediation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- package-lock.json package.json; then
            echo "No audit remediation changes."
          else
            git add package-lock.json package.json
            git commit -m "security(deps): apply non-breaking npm audit fixes"
            git push
          fi

      - name: Remove one-time workflow
        if: \${{ always() }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-npm-audit-remediation.yml
          git commit -m "chore: remove one-time npm audit workflow" || true
          git push || true
