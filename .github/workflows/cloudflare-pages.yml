# CI gate for every push to main and every PR targeting main.
# Production deploys are handled by Render's Git integration. This workflow only
# verifies that the npm dependency graph, Prisma client generation, tests and
# TypeScript compile cleanly before changes are considered healthy.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Tests
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit
