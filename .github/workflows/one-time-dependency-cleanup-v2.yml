name: One-time dependency cleanup v2

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Remove obsolete Cloudflare adapter and patch Next.js
        env:
          DATABASE_URL: \${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          npm pkg delete scripts.build:cf scripts.preview:cf
          npm uninstall @cloudflare/next-on-pages wrangler --save-dev --legacy-peer-deps
          npm install next@16.3.5 --save-exact --legacy-peer-deps
          npx prisma generate
          npm test
          npx tsc --noEmit

      - name: Commit dependency cleanup
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "security(deps): remove obsolete cloudflare adapter and patch Next.js"
          git push

      - name: Remove one-time workflow
        if: \${{ always() }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-dependency-cleanup-v2.yml
          git commit -m "chore: remove one-time dependency cleanup workflow"
          git push
