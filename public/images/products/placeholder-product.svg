<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F8F5F0"/>
      <stop offset="50%" style="stop-color:#F2EDE5"/>
      <stop offset="100%" style="stop-color:#EDE7DC"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C9A96E"/>
      <stop offset="50%" style="stop-color:#D4B87A"/>
      <stop offset="100%" style="stop-color:#B8935A"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="35%">
      <stop offset="0%" style="stop-color:#C9A96E;stop-opacity:0.06"/>
      <stop offset="100%" style="stop-color:#C9A96E;stop-opacity:0"/>
    </radialGradient>
    <filter id="softShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.08"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg)"/>
  <rect width="400" height="400" fill="url(#centerGlow)"/>
  
  <!-- Subtle grid pattern -->
  <g opacity="0.03">
    <line x1="0" y1="100" x2="400" y2="100" stroke="#C9A96E" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="400" y2="200" stroke="#C9A96E" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="400" y2="300" stroke="#C9A96E" stroke-width="0.5"/>
    <line x1="100" y1="0" x2="100" y2="400" stroke="#C9A96E" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="400" stroke="#C9A96E" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="400" stroke="#C9A96E" stroke-width="0.5"/>
  </g>
  
  <!-- Elegant box silhouette with shadow -->
  <g filter="url(#softShadow)">
    <!-- Box body -->
    <rect x="130" y="110" width="140" height="180" rx="4" fill="none" stroke="url(#goldAccent)" stroke-width="1.5"/>
    <!-- Box lid line -->
    <line x1="130" y1="145" x2="270" y2="145" stroke="#C9A96E" stroke-width="0.8" opacity="0.4"/>
    <!-- Ribbon vertical -->
    <line x1="200" y1="110" x2="200" y2="290" stroke="#C9A96E" stroke-width="0.8" opacity="0.3"/>
    <!-- Ribbon horizontal -->
    <line x1="130" y1="210" x2="270" y2="210" stroke="#C9A96E" stroke-width="0.8" opacity="0.3"/>
    <!-- Bow -->
    <path d="M200 145 Q185 130 190 120 Q195 125 200 130 Q205 125 210 120 Q215 130 200 145" fill="#C9A96E" opacity="0.12"/>
    <path d="M200 145 Q192 155 185 152 Q190 148 200 145" fill="#C9A96E" opacity="0.08"/>
    <path d="M200 145 Q208 155 215 152 Q210 148 200 145" fill="#C9A96E" opacity="0.08"/>
    <circle cx="200" cy="145" r="2.5" fill="#C9A96E" opacity="0.2"/>
  </g>
  
  <!-- Inner content hint -->
  <rect x="148" y="155" width="104" height="120" rx="2" fill="#C9A96E" opacity="0.03"/>
  
  <!-- Corner decorations -->
  <g opacity="0.12">
    <!-- Top-left corner -->
    <path d="M130 110 L145 110" stroke="#C9A96E" stroke-width="0.8"/>
    <path d="M130 110 L130 125" stroke="#C9A96E" stroke-width="0.8"/>
    <!-- Top-right corner -->
    <path d="M270 110 L255 110" stroke="#C9A96E" stroke-width="0.8"/>
    <path d="M270 110 L270 125" stroke="#C9A96E" stroke-width="0.8"/>
    <!-- Bottom-left corner -->
    <path d="M130 290 L145 290" stroke="#C9A96E" stroke-width="0.8"/>
    <path d="M130 290 L130 275" stroke="#C9A96E" stroke-width="0.8"/>
    <!-- Bottom-right corner -->
    <path d="M270 290 L255 290" stroke="#C9A96E" stroke-width="0.8"/>
    <path d="M270 290 L270 275" stroke="#C9A96E" stroke-width="0.8"/>
  </g>
  
  <!-- Decorative dots below -->
  <g opacity="0.15">
    <circle cx="180" cy="330" r="2" fill="#C9A96E"/>
    <circle cx="200" cy="330" r="2" fill="#D4B87A"/>
    <circle cx="220" cy="330" r="2" fill="#C9A96E"/>
  </g>
  
  <!-- Subtle premium shimmer -->
  <path d="M150 180 Q200 160 250 180" fill="none" stroke="#C9A96E" stroke-width="0.4" opacity="0.08"/>
</svg>