<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1a16"/>
      <stop offset="35%" style="stop-color:#2a2420"/>
      <stop offset="65%" style="stop-color:#342c24"/>
      <stop offset="100%" style="stop-color:#1a1714"/>
    </linearGradient>
    <radialGradient id="glow1" cx="30%" cy="50%" r="45%">
      <stop offset="0%" style="stop-color:#C9A96E;stop-opacity:0.15"/>
      <stop offset="60%" style="stop-color:#C9A96E;stop-opacity:0.04"/>
      <stop offset="100%" style="stop-color:#C9A96E;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="70%" cy="40%" r="40%">
      <stop offset="0%" style="stop-color:#8B7355;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#8B7355;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="goldShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C9A96E;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#D4B87A;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#C9A96E;stop-opacity:0"/>
    </linearGradient>
    <!-- Elegant damask-inspired pattern -->
    <pattern id="damask" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M40 0 Q55 20 40 40 Q25 20 40 0" fill="none" stroke="#C9A96E" stroke-width="0.3" opacity="0.06"/>
      <path d="M0 40 Q20 55 40 40 Q20 25 0 40" fill="none" stroke="#C9A96E" stroke-width="0.3" opacity="0.06"/>
      <path d="M40 40 Q55 60 40 80 Q25 60 40 40" fill="none" stroke="#D4B87A" stroke-width="0.2" opacity="0.04"/>
      <path d="M40 40 Q60 55 80 40 Q60 25 40 40" fill="none" stroke="#D4B87A" stroke-width="0.2" opacity="0.04"/>
      <circle cx="40" cy="40" r="2" fill="#C9A96E" opacity="0.04"/>
    </pattern>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.025"/></feComponentTransfer>
      <feBlend in="SourceGraphic" mode="overlay"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="500" fill="url(#bg)"/>
  <rect width="1200" height="500" fill="url(#glow1)"/>
  <rect width="1200" height="500" fill="url(#glow2)"/>
  <rect width="1200" height="500" fill="url(#damask)"/>
  
  <!-- Elegant room silhouette suggestion -->
  <g opacity="0.04">
    <!-- Floor line -->
    <line x1="0" y1="350" x2="1200" y2="350" stroke="#C9A96E" stroke-width="0.5"/>
    <!-- Wall corner -->
    <line x1="400" y1="50" x2="400" y2="350" stroke="#C9A96E" stroke-width="0.3"/>
    <!-- Furniture silhouettes -->
    <rect x="100" y="250" width="200" height="100" rx="3" fill="none" stroke="#C9A96E" stroke-width="0.5"/>
    <rect x="800" y="200" width="250" height="150" rx="3" fill="none" stroke="#C9A96E" stroke-width="0.5"/>
    <!-- Shelf -->
    <line x1="450" y1="150" x2="700" y2="150" stroke="#C9A96E" stroke-width="0.4"/>
    <line x1="450" y1="220" x2="700" y2="220" stroke="#C9A96E" stroke-width="0.4"/>
    <!-- Picture frame on wall -->
    <rect x="500" y="70" width="120" height="70" rx="2" fill="none" stroke="#C9A96E" stroke-width="0.4"/>
  </g>
  
  <!-- Flowing curves -->
  <g opacity="0.08">
    <path d="M0 250 C300 200 600 280 900 220 Q1050 190 1200 210" fill="none" stroke="#C9A96E" stroke-width="0.6"/>
    <path d="M0 270 C300 220 600 300 900 240 Q1050 210 1200 230" fill="none" stroke="#D4B87A" stroke-width="0.4"/>
  </g>
  
  <!-- Gold accent lines -->
  <rect x="100" y="248" width="1000" height="0.4" fill="url(#goldShimmer)" opacity="0.5"/>
  
  <!-- Corner ornaments -->
  <g opacity="0.12">
    <path d="M30 30 L30 70" stroke="#C9A96E" stroke-width="0.8"/>
    <path d="M30 30 L70 30" stroke="#C9A96E" stroke-width="0.8"/>
    <circle cx="30" cy="30" r="2" fill="#C9A96E"/>
  </g>
  <g opacity="0.12" transform="translate(1200,0) scale(-1,1)">
    <path d="M30 30 L30 70" stroke="#C9A96E" stroke-width="0.8"/>
    <path d="M30 30 L70 30" stroke="#C9A96E" stroke-width="0.8"/>
    <circle cx="30" cy="30" r="2" fill="#C9A96E"/>
  </g>
  <g opacity="0.12" transform="translate(0,500) scale(1,-1)">
    <path d="M30 30 L30 70" stroke="#C9A96E" stroke-width="0.8"/>
    <path d="M30 30 L70 30" stroke="#C9A96E" stroke-width="0.8"/>
  </g>
  <g opacity="0.12" transform="translate(1200,500) scale(-1,-1)">
    <path d="M30 30 L30 70" stroke="#C9A96E" stroke-width="0.8"/>
    <path d="M30 30 L70 30" stroke="#C9A96E" stroke-width="0.8"/>
  </g>
  
  <!-- Floating geometric accents -->
  <g opacity="0.05">
    <circle cx="150" cy="120" r="25" fill="none" stroke="#C9A96E" stroke-width="0.5"/>
    <circle cx="150" cy="120" r="18" fill="none" stroke="#C9A96E" stroke-width="0.3"/>
    <path d="M1050 380 L1070 360 L1090 380 L1070 400 Z" fill="none" stroke="#D4B87A" stroke-width="0.5"/>
    <rect x="250" y="350" width="30" height="30" rx="1" fill="none" stroke="#C9A96E" stroke-width="0.4" transform="rotate(15 265 365)"/>
  </g>
  
  <!-- Sparkle dots -->
  <g opacity="0.2">
    <circle cx="200" cy="100" r="1.5" fill="#C9A96E"/>
    <circle cx="500" cy="60" r="1" fill="#D4B87A"/>
    <circle cx="800" cy="120" r="1.5" fill="#C9A96E"/>
    <circle cx="1050" cy="80" r="1" fill="#C9A96E"/>
    <circle cx="350" cy="400" r="1" fill="#D4B87A"/>
    <circle cx="650" cy="420" r="1.5" fill="#C9A96E"/>
    <circle cx="950" cy="380" r="1" fill="#C9A96E"/>
  </g>
  
  <!-- Texture overlay -->
  <rect width="1200" height="500" fill="transparent" filter="url(#noise)" opacity="0.3"/>
</svg>