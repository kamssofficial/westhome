<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EBE7DF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5F3EF;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="35%">
      <stop offset="0%" style="stop-color:#B56C45;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#B56C45;stop-opacity:0" />
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)" rx="16"/>
  <circle cx="400" cy="270" r="200" fill="url(#glow)"/>
  <!-- Vase silhouette -->
  <g opacity="0.15" fill="#1F211F">
    <ellipse cx="400" cy="290" rx="90" ry="150"/>
    <rect x="388" y="150" width="24" height="30" rx="6"/>
    <ellipse cx="400" cy="150" rx="46" ry="14"/>
  </g>
  <!-- Label -->
  <text x="400" y="520" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#1F211F" letter-spacing="0.16em" opacity="0.5">VASES</text>
</svg>