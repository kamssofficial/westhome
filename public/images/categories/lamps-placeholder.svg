<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EBE7DF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5F3EF;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="35%">
      <stop offset="0%" style="stop-color:#B56C45;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#B56C45;stop-opacity:0" />
    </radialGradient>
  </defs>
  <rect width="600" height="800" fill="url(#bg)" rx="16"/>
  <!-- Lamp glow -->
  <circle cx="300" cy="320" r="200" fill="url(#glow)"/>
  <!-- Lamp silhouette -->
  <g opacity="0.15" fill="#1F211F">
    <ellipse cx="300" cy="280" rx="80" ry="100"/>
    <rect x="295" y="370" width="10" height="120" rx="3"/>
    <ellipse cx="300" cy="500" rx="50" ry="12"/>
  </g>
  <!-- Light rays -->
  <g opacity="0.06" stroke="#B56C45" stroke-width="1" fill="none">
    <line x1="300" y1="180" x2="300" y2="100"/>
    <line x1="350" y1="200" x2="400" y2="140"/>
    <line x1="250" y1="200" x2="200" y2="140"/>
    <line x1="380" y1="250" x2="440" y2="220"/>
    <line x1="220" y1="250" x2="160" y2="220"/>
  </g>
  <!-- Label -->
  <text x="300" y="710" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#1F211F" letter-spacing="0.16em" opacity="0.5">LAMPS</text>
</svg>