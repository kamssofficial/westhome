      <line x1="0" y1="-85" x2="0" y2="-78" stroke="#2C2C2C" stroke-width="0.5" transform="rotate(288)"/>
      <line x1="0" y1="-85" x2="0" y2="-78" stroke="#2C2C2C" stroke-width="0.5" transform="rotate(294)"/>
      <line x1="0" y1="-85" x2="0" y2="-78" stroke="#2C2C2C" stroke-width="0.5" transform="rotate(306)"/>
