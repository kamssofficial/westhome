      <line x1="0" y1="-85" x2="0" y2="-78" stroke="#2C2C2C" stroke-width="0.5" transform="rotate(108)"/>
      <line x1="0" y1="-85" x2="0" y2="-78" stroke="#2C2C2C" stroke-width="0.5" transform="rotate(114)"/>
      <line x1="0" y1="-85" x2="0" y2="-78" stroke="#2C2C2C" stroke-width="0.5" transform="rotate(126)"/>
