<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F8F5F0"/>
      <stop offset="100%" style="stop-color:#EDE8DF"/>
    </linearGradient>
    <linearGradient id="gold6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B8935A"/>
      <stop offset="50%" style="stop-color:#D4B87A"/>
      <stop offset="100%" style="stop-color:#C9A96E"/>
    </linearGradient>
    <radialGradient id="clockFace" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFFEF8"/>
      <stop offset="85%" style="stop-color:#F8F5F0"/>
      <stop offset="100%" style="stop-color:#EDE8DF"/>
    </radialGradient>
    <radialGradient id="glow6" cx="50%" cy="42%" r="30%">
      <stop offset="0%" style="stop-color:#C9A96E;stop-opacity:0.06"/>
      <stop offset="100%" style="stop-color:#C9A96E;stop-opacity:0"/>
    </radialGradient>
    <filter id="clockShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.08"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="400" height="400" fill="url(#bg6)"/>
  <rect width="400" height="400" fill="url(#glow6)"/>
  
  <!-- Main clock -->
  <g transform="translate(200,170)" filter="url(#clockShadow)">
    <!-- Clock body/rim -->
    <circle r="95" fill="url(#clockFace)" stroke="url(#gold6)" stroke-width="3"/>
    <circle r="88" fill="none" stroke="#C9A96E" stroke-width="0.5" opacity="0.3"/>
    
    <!-- Hour markers -->
    <g opacity="0.3">
      <!-- 12 -->
      <rect x="-2" y="-82" width="4" height="12" rx="1" fill="#2C2C2C"/>
      <!-- 1 -->
      <rect x="35" y="-74" width="3" height="10" rx="1" fill="#2C2C2C" transform="rotate(30 36 -69)"/>
      <!-- 2 -->
      <rect x="62" y="-50" width="3" height="10" rx="1" fill="#2C2C2C" transform="rotate(60 63 -45)"/>
      <!-- 3 -->
      <rect x="72" y="-2" width="12" height="4" rx="1" fill="#2C2C2C"/>
      <!-- 4 -->
      <rect x="62" y="40" width="3" height="10" rx="1" fill="#2C2C2C" transform="rotate(120 63 45)"/>
      <!-- 5 -->
      <rect x="35" y="64" width="3" height="10" rx="1" fill="#2C2C2C" transform="rotate(150 36 69)"/>
      <!-- 6 -->
      <rect x="-2" y="70" width="4" height="12" rx="1" fill="#2C2C2C"/>
      <!-- 7 -->
      <rect x="-38" y="64" width="3" height="10" rx="1" fill="#2C2C2C" transform="rotate(210 -37 69)"/>
      <!-- 8 -->
      <rect x="-65" y="40" width="3" height="10" rx="1" fill="#2C2C2C" transform="rotate(240 -64 45)"/>
      <!-- 9 -->
      <rect x="-84" y="-2" width="12" height="4" rx="1" fill="#2C2C2C"/>
      <!-- 10 -->
      <rect x="-65" y="-50" width="3" height="10" rx="1" fill="#2C2C2C" transform="rotate(300 -64 -45)"/>
      <!-- 11 -->
      <rect x="-38" y="-74" width="3" height="10" rx="1" fill="#2C2C2C" transform="rotate(330 -37 -69)"/>
    </g>
    
    <!-- Minute tick marks -->
    <g opacity="0.12">
      <line x1="0" y1="-85" x2="0" y2="-78" stroke="#2C2C2C" stroke-width="0.5" transform="rotate(6)"/>
      <line x1="0" y1="-85" x2="0" y2="-78" stroke="#2C2C2C" stroke-width="0.5" transform="rotate(12)"/>
      <line x1="0" y1="-85" x2="0" y2="-78" stroke="#2C2C2C" stroke-width="0.5" transform="rotate(18)"/>
