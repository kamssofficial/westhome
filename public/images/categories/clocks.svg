      <line x1="0" y1="-85" x2="0" y2="-78" stroke="#2C2C2C" stroke-width="0.5" transform="rotate(318)"/>
      <line x1="0" y1="-85" x2="0" y2="-78" stroke="#2C2C2C" stroke-width="0.5" transform="rotate(324)"/>
      <line x1="0" y1="-85" x2="0" y2="-78" stroke="#2C2C2C" stroke-width="0.5" transform="rotate(336)"/>
      <line x1="0" y1="-85" x2="0" y2="-78" stroke="#2C2C2C" stroke-width="0.5" transform="rotate(342)"/>
      <line x1="0" y1="-85" x2="0" y2="-78" stroke="#2C2C2C" stroke-width="0.5" transform="rotate(348)"/>
      <line x1="0" y1="-85" x2="0" y2="-78" stroke="#2C2C2C" stroke-width="0.5" transform="rotate(354)"/>
    </g>
    
    <!-- Clock hands - showing 10:10 (classic display time) -->
    <!-- Hour hand -->
    <line x1="0" y1="8" x2="-28" y2="-48" stroke="#2C2C2C" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <!-- Minute hand -->
    <line x1="0" y1="8" x2="32" y2="-52" stroke="#2C2C2C" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <!-- Second hand -->
    <line x1="0" y1="12" x2="15" y2="-65" stroke="#C9A96E" stroke-width="0.8" stroke-linecap="round" opacity="0.4"/>
    
    <!-- Center cap -->
    <circle r="5" fill="#2C2C2C" opacity="0.2"/>
    <circle r="3" fill="#C9A96E" opacity="0.3"/>
    
    <!-- Brand text area -->
    <text x="0" y="-28" text-anchor="middle" font-family="Georgia, serif" font-size="6" fill="#2C2C2C" opacity="0.2" letter-spacing="1">WESTHOME</text>
  </g>
  
  <!-- Decorative dots -->
  <g opacity="0.15">
    <circle cx="55" cy="70" r="1.5" fill="#C9A96E"/>
    <circle cx="350" cy="80" r="1" fill="#D4B87A"/>
    <circle cx="50" cy="340" r="1" fill="#C9A96E"/>
    <circle cx="360" cy="340" r="1.5" fill="#C9A96E"/>
  </g>
  
  <!-- Label -->
  <text x="200" y="365" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#2C2C2C" font-weight="400" letter-spacing="3" opacity="0.7">CLOCKS</text>
  <line x1="162" y1="375" x2="238" y2="375" stroke="url(#gold6)" stroke-width="0.8" opacity="0.5"/>
</svg>