<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F8F5F0"/>
      <stop offset="100%" style="stop-color:#EDE8DF"/>
    </linearGradient>
    <linearGradient id="gold3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B8935A"/>
      <stop offset="50%" style="stop-color:#D4B87A"/>
      <stop offset="100%" style="stop-color:#C9A96E"/>
    </linearGradient>
    <radialGradient id="glow3" cx="50%" cy="42%" r="30%">
      <stop offset="0%" style="stop-color:#C9A96E;stop-opacity:0.06"/>
      <stop offset="100%" style="stop-color:#C9A96E;stop-opacity:0"/>
    </radialGradient>
  </defs>
  
  <rect width="400" height="400" fill="url(#bg3)"/>
  <rect width="400" height="400" fill="url(#glow3)"/>
  
  <!-- Elegant bed illustration -->
  <g transform="translate(200,170)">
    <!-- Bed base/frame -->
    <rect x="-100" y="30" width="200" height="45" rx="3" fill="#C9A96E" opacity="0.05" stroke="#C9A96E" stroke-width="1.2"/>
    
    <!-- Mattress -->
    <rect x="-90" y="0" width="180" height="35" rx="5" fill="#C9A96E" opacity="0.04" stroke="#C9A96E" stroke-width="0.8"/>
    
    <!-- Comforter layer 1 (base) -->
    <path d="M-85 5 Q-90 25 -85 35 L85 35 Q90 25 85 5 Z" fill="#C9A96E" opacity="0.06" stroke="#C9A96E" stroke-width="0.8"/>
    <!-- Quilted pattern on comforter -->
    <g opacity="0.08">
      <path d="M-70 10 L-50 25 L-30 10 L-10 25 L10 10 L30 25 L50 10 L70 25" fill="none" stroke="#C9A96E" stroke-width="0.5"/>
      <path d="M-75 18 L-55 33 L-35 18 L-15 33 L5 18 L25 33 L45 18 L65 33" fill="none" stroke="#D4B87A" stroke-width="0.4"/>
    </g>
    
    <!-- Comforter fold-over -->
    <path d="M-85 5 Q-80 -2 -70 -5 L70 -5 Q80 -2 85 5" fill="#D4B87A" opacity="0.05" stroke="#D4B87A" stroke-width="0.6"/>
    
    <!-- Pillows -->
    <ellipse cx="-45" cy="-20" rx="40" ry="18" fill="#C9A96E" opacity="0.05" stroke="#C9A96E" stroke-width="0.8"/>
    <ellipse cx="-45" cy="-20" rx="32" ry="12" fill="#C9A96E" opacity="0.03"/>
    <ellipse cx="45" cy="-18" rx="38" ry="17" fill="#D4B87A" opacity="0.04" stroke="#D4B87A" stroke-width="0.8"/>
    <ellipse cx="45" cy="-18" rx="30" ry="11" fill="#D4B87A" opacity="0.03"/>
    
    <!-- Headboard suggestion -->
    <rect x="-95" y="-55" width="190" height="35" rx="3" fill="none" stroke="#C9A96E" stroke-width="1" opacity="0.3"/>
    <path d="M-95 -55 Q0 -70 95 -55" fill="none" stroke="#C9A96E" stroke-width="0.8" opacity="0.2"/>
    
    <!-- Bed legs -->
    <rect x="-95" y="72" width="6" height="18" rx="2" fill="#C9A96E" opacity="0.1"/>
    <rect x="89" y="72" width="6" height="18" rx="2" fill="#C9A96E" opacity="0.1"/>
  </g>
  
  <!-- Side table suggestion -->
  <g opacity="0.15" transform="translate(340,230)">
    <rect x="-15" y="-30" width="30" height="5" rx="1" fill="none" stroke="#C9A96E" stroke-width="0.8"/>
    <rect x="-12" y="-25" width="3" height="40" fill="#C9A96E" opacity="0.3"/>
    <rect x="9" y="-25" width="3" height="40" fill="#C9A96E" opacity="0.3"/>
    <!-- Lamp on table -->
    <path d="M0 -30 L0 -50" stroke="#C9A96E" stroke-width="0.6"/>
    <ellipse cx="0" cy="-55" rx="10" ry="6" fill="none" stroke="#D4B87A" stroke-width="0.6"/>
  </g>
  
  <!-- Decorative dots -->
  <g opacity="0.15">
    <circle cx="60" cy="80" r="1.5" fill="#C9A96E"/>
    <circle cx="340" cy="130" r="1" fill="#D4B87A"/>
    <circle cx="50" cy="350" r="1" fill="#C9A96E"/>
  </g>
  
  <!-- Label -->
  <text x="200" y="365" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#2C2C2C" font-weight="400" letter-spacing="3" opacity="0.7">COMFORTERS</text>
  <line x1="145" y1="375" x2="255" y2="375" stroke="url(#gold3)" stroke-width="0.8" opacity="0.5"/>
</svg>