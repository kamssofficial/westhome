<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EBE7DF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5F3EF;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#bg)" rx="16"/>
  <!-- Carpet border pattern -->
  <g opacity="0.1" fill="none" stroke="#B56C45" stroke-width="2">
    <rect x="120" y="160" width="360" height="480" rx="4"/>
    <rect x="140" y="180" width="320" height="440" rx="4"/>
    <rect x="160" y="200" width="280" height="400" rx="4"/>
  </g>
  <!-- Diamond pattern -->
  <g opacity="0.08" fill="#B56C45">
    <polygon points="300,260 340,300 300,340 260,300"/>
    <polygon points="300,340 340,380 300,420 260,380"/>
    <polygon points="300,420 340,460 300,500 260,460"/>
    <polygon points="220,300 260,340 220,380 180,340"/>
    <polygon points="380,300 420,340 380,380 340,340"/>
    <polygon points="220,420 260,460 220,500 180,460"/>
    <polygon points="380,420 420,460 380,500 340,460"/>
  </g>
  <!-- Corner ornaments -->
  <g opacity="0.06" fill="#B56C45">
    <circle cx="180" cy="220" r="8"/>
    <circle cx="420" cy="220" r="8"/>
    <circle cx="180" cy="580" r="8"/>
    <circle cx="420" cy="580" r="8"/>
  </g>
  <!-- Label -->
  <text x="300" y="710" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#1F211F" letter-spacing="0.16em" opacity="0.5">CARPETS</text>
</svg>