<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F8F5F0"/>
      <stop offset="100%" style="stop-color:#EDE8DF"/>
    </linearGradient>
    <linearGradient id="gold7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B8935A"/>
      <stop offset="50%" style="stop-color:#D4B87A"/>
      <stop offset="100%" style="stop-color:#C9A96E"/>
    </linearGradient>
    <radialGradient id="glow7" cx="50%" cy="42%" r="30%">
      <stop offset="0%" style="stop-color:#C9A96E;stop-opacity:0.06"/>
      <stop offset="100%" style="stop-color:#C9A96E;stop-opacity:0"/>
    </radialGradient>
  </defs>
  
  <rect width="400" height="400" fill="url(#bg7)"/>
  <rect width="400" height="400" fill="url(#glow7)"/>
  
  <!-- Decorative tray -->
  <g transform="translate(200,180)">
    <!-- Tray base -->
    <ellipse cx="0" cy="40" rx="100" ry="30" fill="#C9A96E" opacity="0.04" stroke="url(#gold7)" stroke-width="1.2"/>
    <ellipse cx="0" cy="35" rx="90" ry="25" fill="#C9A96E" opacity="0.02" stroke="#C9A96E" stroke-width="0.4" opacity="0.3"/>
    
    <!-- Perfume bottle -->
    <g transform="translate(-40,-10)">
      <!-- Bottle body -->
      <rect x="-12" y="-20" width="24" height="40" rx="4" fill="#C9A96E" opacity="0.05" stroke="#C9A96E" stroke-width="1"/>
      <!-- Bottle neck -->
      <rect x="-5" y="-30" width="10" height="12" rx="2" fill="#C9A96E" opacity="0.04" stroke="#C9A96E" stroke-width="0.6"/>
      <!-- Cap -->
      <rect x="-7" y="-38" width="14" height="10" rx="2" fill="#D4B87A" opacity="0.08" stroke="#D4B87A" stroke-width="0.6"/>
      <!-- Label -->
      <rect x="-8" y="-8" width="16" height="12" rx="1" fill="none" stroke="#C9A96E" stroke-width="0.3" opacity="0.3"/>
      <!-- Liquid level -->
      <rect x="-10" y="0" width="20" height="18" rx="3" fill="#D4B87A" opacity="0.04"/>
    </g>
    
    <!-- Candle -->
    <g transform="translate(30,-5)">
      <!-- Candle jar -->
      <rect x="-14" y="-15" width="28" height="30" rx="3" fill="#C9A96E" opacity="0.04" stroke="#C9A96E" stroke-width="0.8"/>
      <!-- Wax -->
      <rect x="-12" y="-10" width="24" height="22" rx="2" fill="#D4B87A" opacity="0.04"/>
      <!-- Wick -->
      <line x1="0" y1="-15" x2="0" y2="-22" stroke="#2C2C2C" stroke-width="0.6" opacity="0.3"/>
      <!-- Flame -->
      <path d="M0 -22 Q-3 -27 0 -32 Q3 -27 0 -22" fill="#D4B87A" opacity="0.15"/>
      <path d="M0 -24 Q-1.5 -27 0 -30 Q1.5 -27 0 -24" fill="#D4B87A" opacity="0.1"/>
      <!-- Label -->
      <rect x="-10" y="-2" width="20" height="8" rx="1" fill="none" stroke="#C9A96E" stroke-width="0.3" opacity="0.25"/>
    </g>
    
    <!-- Small decorative box -->
    <g transform="translate(-10,10)">
      <rect x="-15" y="-8" width="30" height="18" rx="2" fill="#C9A96E" opacity="0.04" stroke="#C9A96E" stroke-width="0.6"/>
      <!-- Lid line -->
      <line x1="-15" y1="-2" x2="15" y2="-2" stroke="#C9A96E" stroke-width="0.4" opacity="0.3"/>
      <!-- Ribbon -->
      <line x1="0" y1="-8" x2="0" y2="10" stroke="#D4B87A" stroke-width="0.4" opacity="0.2"/>
      <line x1="-15" y1="1" x2="15" y2="1" stroke="#D4B87A" stroke-width="0.4" opacity="0.2"/>
    </g>
    
    <!-- Decorative sprig/leaf -->
    <g transform="translate(55,-25)" opacity="0.15">
      <path d="M0 15 Q-5 5 -3 -5 Q0 -10 3 -5 Q5 5 0 15" fill="#C9A96E" opacity="0.3"/>
      <line x1="0" y1="15" x2="0" y2="-10" stroke="#8B7355" stroke-width="0.5"/>
      <path d="M0 5 Q-8 0 -6 -5" fill="none" stroke="#8B7355" stroke-width="0.4"/>
      <path d="M0 0 Q8 -5 6 -10" fill="none" stroke="#8B7355" stroke-width="0.4"/>
    </g>
  </g>
  
  <!-- Floating accessory items -->
  <!-- Small mirror -->
  <g opacity="0.12" transform="translate(70,100)">
    <circle r="20" fill="#C9A96E" opacity="0.03" stroke="#C9A96E" stroke-width="0.8"/>
    <circle r="16" fill="#FFFEF8" opacity="0.3" stroke="#C9A96E" stroke-width="0.3"/>
    <line x1="-10" y1="-10" x2="-5" y2="-5" stroke="#C9A96E" stroke-width="0.3" opacity="0.3"/>
  </g>
  
  <!-- Decorative beads -->
  <g opacity="0.1">
    <circle cx="320" cy="100" r="4" fill="none" stroke="#C9A96E" stroke-width="0.6"/>
    <circle cx="330" cy="105" r="3" fill="none" stroke="#D4B87A" stroke-width="0.5"/>
    <circle cx="338" cy="108" r="3.5" fill="none" stroke="#C9A96E" stroke-width="0.5"/>
    <circle cx="348" cy="110" r="2.5" fill="none" stroke="#D4B87A" stroke-width="0.4"/>
  </g>
  
  <!-- Decorative dots -->
  <g opacity="0.15">
    <circle cx="55" cy="70" r="1.5" fill="#C9A96E"/>
    <circle cx="350" cy="340" r="1.5" fill="#C9A96E"/>
    <circle cx="360" cy="80" r="1" fill="#D4B87A"/>
    <circle cx="50" cy="340" r="1" fill="#C9A96E"/>
  </g>
  
  <!-- Label -->
  <text x="200" y="365" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#2C2C2C" font-weight="400" letter-spacing="3" opacity="0.7">ACCESSORIES</text>
  <line x1="140" y1="375" x2="260" y2="375" stroke="url(#gold7)" stroke-width="0.8" opacity="0.5"/>
</svg>