<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EBE7DF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5F3EF;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#bg)" rx="16"/>
  <!-- Clock face -->
  <circle cx="300" cy="360" r="160" fill="none" stroke="#1F211F" stroke-width="2" opacity="0.12"/>
  <circle cx="300" cy="360" r="150" fill="none" stroke="#1F211F" stroke-width="0.5" opacity="0.08"/>
  <!-- Hour markers -->
  <g opacity="0.15" fill="#1F211F">
    <rect x="298" y="212" width="4" height="16" rx="2"/>
    <rect x="298" y="492" width="4" height="16" rx="2"/>
    <rect x="438" y="358" width="16" height="4" rx="2"/>
    <rect x="146" y="358" width="16" height="4" rx="2"/>
  </g>
  <!-- Minute markers -->
  <g opacity="0.08" stroke="#1F211F" stroke-width="1">
    <line x1="300" y1="215" x2="300" y2="225" transform="rotate(30,300,360)"/>
    <line x1="300" y1="215" x2="300" y2="225" transform="rotate(60,300,360)"/>
    <line x1="300" y1="215" x2="300" y2="225" transform="rotate(120,300,360)"/>
    <line x1="300" y1="215" x2="300" y2="225" transform="rotate(150,300,360)"/>
    <line x1="300" y1="215" x2="300" y2="225" transform="rotate(210,300,360)"/>
    <line x1="300" y1="215" x2="300" y2="225" transform="rotate(240,300,360)"/>
    <line x1="300" y1="215" x2="300" y2="225" transform="rotate(300,300,360)"/>
    <line x1="300" y1="215" x2="300" y2="225" transform="rotate(330,300,360)"/>
  </g>
  <!-- Clock hands -->
  <g opacity="0.2" stroke="#1F211F" stroke-width="2.5" stroke-linecap="round">
    <line x1="300" y1="360" x2="300" y2="260"/>
    <line x1="300" y1="360" x2="370" y2="320"/>
  </g>
  <!-- Center dot -->
  <circle cx="300" cy="360" r="5" fill="#B56C45" opacity="0.3"/>
  <!-- Label -->
  <text x="300" y="710" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#1F211F" letter-spacing="0.16em" opacity="0.5">CLOCKS</text>
</svg>